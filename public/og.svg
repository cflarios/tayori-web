  <text x="160" y="112" fill="#ffffff" font-size="40" font-weight="800">Tayori</text>
  <text x="286" y="112" fill="#6c6c85" font-size="30" font-weight="600">頼り</text>

  <text x="90" y="300" fill="#ffffff" font-size="72" font-weight="800">Your AI wingman</text>
  <text x="90" y="382" fill="url(#grad)" font-size="72" font-weight="800">for the call.</text>
  <text x="90" y="462" fill="#9a9ab0" font-size="34" font-weight="500">Invisible when you share your screen. Live transcription,</text>
  <text x="90" y="506" fill="#9a9ab0" font-size="34" font-weight="500">suggested answers, runs on your machine.</text>
  <g transform="translate(90 555)">
    <rect width="360" height="44" rx="22" fill="#ffffff" opacity="0.06"/>
    <text x="24" y="29" fill="#dcdbe8" font-size="22" font-weight="600">Open source · MIT · Windows</text>
